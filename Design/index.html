<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecommerce — Redesign</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    html, body { margin: 0; padding: 0; background: #efeae0; font-family: "Inter Tight", system-ui, sans-serif; }
    .dc-intro {
      padding: 24px 32px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .dc-intro h1 {
      font-family: "Newsreader", serif;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      color: #18170f;
    }
    .dc-intro p { color: #6b6b66; margin: 0 0 4px; max-width: 720px; line-height: 1.5; font-size: 14px; }
    .dc-intro .pill {
      display: inline-flex; gap: 8px; padding: 4px 10px; border-radius: 99px;
      background: #f4e7dc; color: #6e3414; font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="page-home.jsx"></script>
  <script type="text/babel" src="page-products.jsx"></script>
  <script type="text/babel" src="page-detail.jsx"></script>
  <script type="text/babel" src="page-cart.jsx"></script>
  <script type="text/babel" src="page-categories.jsx"></script>
  <script type="text/babel" src="page-login.jsx"></script>
  <script type="text/babel" src="page-admin.jsx"></script>

  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    function EshopApp() {
      return (
        <div>
          <div className="dc-intro">
            <span className="pill">Blazor E-Shop · Redesigned</span>
            <h1>From default Bootstrap → a considered editorial system.</h1>
            <p>
              Seven pages remixed against a single visual system — warm cream + ink, Newsreader serif paired with
              Inter Tight, terracotta accent. Drag-reorder the boards or click any one to focus.
            </p>
            <p style={{ marginTop: 8, fontSize: 13 }}>
              Each board is the redesigned counterpart of a Razor page in your codebase. Bugs called out in my
              earlier review (Admin stock column, cart NaN crash, no confirmations, no quantity stepper feedback,
              etc.) are all fixed in these mocks.
            </p>
          </div>
          <window.DesignCanvas initialZoom={0.55}>
            <window.DCSection id="storefront" title="Storefront — customer-facing">
              <window.DCArtboard id="home" label="Home / Index.razor" width={1280} height={1900}>
                <window.PageHome />
              </window.DCArtboard>
              <window.DCArtboard id="products" label="Products list / Products.razor" width={1280} height={1900}>
                <window.PageProducts />
              </window.DCArtboard>
              <window.DCArtboard id="detail" label="Product detail / ProductDetail.razor" width={1280} height={1700}>
                <window.PageProductDetail />
              </window.DCArtboard>
              <window.DCArtboard id="cart" label="Cart / Cart.razor" width={1280} height={1600}>
                <window.PageCart />
              </window.DCArtboard>
              <window.DCArtboard id="categories" label="Categories / Categories.razor" width={1280} height={1200}>
                <window.PageCategories />
              </window.DCArtboard>
              <window.DCArtboard id="login" label="Login / Login.razor" width={1280} height={780}>
                <window.PageLogin />
              </window.DCArtboard>
            </window.DCSection>
            <window.DCSection id="admin" title="Admin — staff-facing">
              <window.DCArtboard id="admin-products" label="Admin products / Admin/Products.razor" width={1280} height={1000}>
                <window.PageAdmin />
              </window.DCArtboard>
            </window.DCSection>
          </window.DesignCanvas>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<EshopApp />);
  </script>
</body>
</html>
